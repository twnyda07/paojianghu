            answer: "庭院中的松樹——當下現成，不假他求。「西來意」無非眼前這一棵松，問者若能在此直下承當，便已得禪旨。按：「庭上一樹松」一語查遍 CBETA 漢文大藏經無一筆，屬後世流傳或日本禪門口語，不可當作唐宋燈錄原文引用。有明確出處的同型公案，是趙州的「庭前柏樹子」（《無門關》第三十七則）。"
          }
        ]
      }
    ]
  }
];

function renderData(filtered) {
  const main = document.getElementById('main');
  main.innerHTML = '';
  filtered.forEach(region => {
    const div = document.createElement('div');
    div.className = 'region';
    div.dataset.region = region.region;
    div.innerHTML = `<div class="region-title">${region.region}</div>
      <div class="locations-grid">${region.locations.map(loc => renderLocation(loc)).join('')}</div>`;
    main.appendChild(div);
  });
  attachKoanListeners();
}

function renderLocation(loc) {
  const koans = loc.koans.map((k, i) => `
    <div class="koan-item" data-index="${i}">
      <div class="koan-title">${k.title}</div>
      <div class="koan-body">
        <div class="koan-question">${k.question.replace(/\n/g, '<br>')}</div>
        <div class="koan-label" style="margin-top:0.6rem">— 指月 —</div>
        <div class="koan-answer">${k.answer}</div>
      </div>
    </div>`).join('');
  return `
    <div class="location-card">
      <div class="location-header">
        <span class="location-name">${loc.name}</span>
        <span class="location-sub">${loc.sub}</span>
        <span class="master-name">${loc.master}</span>
      </div>
      <div class="koans-list">${koans}</div>
      <div class="hidden-count">共 ${loc.koans.length} 則公案</div>
    </div>`;
}

function attachKoanListeners() {
  document.querySelectorAll('.koan-item').forEach(item => {
    item.addEventListener('click', () => item.classList.toggle('open'));
  });
}

function filterRegion(region, btn) {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = region === 'all' ? data : data.filter(r => r.region === region);
  renderData(filtered);
}

renderData(data);
</script>
</body>
</html>
